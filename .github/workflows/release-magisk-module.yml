name: Release ts-docsui modules
run-name: >-
  release • ${{ inputs.version_tag || 'auto patch' }}

'on':
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version, for example v1.2.3. Leave blank to increment the latest patch version.'
        required: false
        default: ''
        type: string
      version_code:
        description: 'Magisk version code. Leave blank to increment the current code by one.'
        required: false
        default: ''
        type: string
      draft:
        description: 'Create the GitHub release as a draft.'
        required: true
        default: false
        type: boolean
      prerelease:
        description: 'Mark the GitHub release as a prerelease.'
        required: true
        default: false
        type: boolean
      replace_existing_assets:
        description: 'Replace assets only when this exact tag and release already exist.'
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: read

concurrency:
  group: ts-docsui-release
  cancel-in-progress: false

jobs:
  release:
    name: Version, build, tag, and publish both variants
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout full default branch history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Validate release context and repository tooling
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_TYPE}" == branch ]] || { echo '::error::Manual releases must be dispatched from a branch.'; exit 1; }
          default_branch='${{ github.event.repository.default_branch }}'
          [[ "${GITHUB_REF_NAME}" == "${default_branch}" ]] || { echo "::error::Dispatch from ${default_branch}, not ${GITHUB_REF_NAME}."; exit 1; }
          git fetch --force --tags origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse "origin/${GITHUB_REF_NAME}")" ]] || { echo '::error::Release checkout is stale.'; exit 1; }
          ruby -e 'require "yaml"; ARGV.each { |f| Psych.safe_load(File.read(f), permitted_classes: [], permitted_symbols: [], aliases: false); puts "OK #{f}" }' .github/workflows/*.yml
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Resolve requested or automatic version
        id: version
        shell: bash
        env:
          INPUT_VERSION_TAG: ${{ inputs.version_tag }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          python3 scripts/release_version.py \
            --repo-root . \
            --module-prop module/module.prop \
            --version-tag "${INPUT_VERSION_TAG}" \
            --version-code "${INPUT_VERSION_CODE}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Check tag and release collisions
        id: collision
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          INPUT_VERSION_TAG: ${{ inputs.version_tag }}
          REPLACE_EXISTING_ASSETS: ${{ inputs.replace_existing_assets }}
        run: |
          set -euo pipefail
          tag_exists=false
          release_exists=false
          git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1 && tag_exists=true || true
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 && release_exists=true || true
          [[ "${release_exists}" != true || "${tag_exists}" == true ]] || { echo '::error::Release exists without its immutable tag.'; exit 1; }

          if [[ "${tag_exists}" == true ]]; then
            [[ -n "$(printf '%s' "${INPUT_VERSION_TAG}" | xargs)" ]] || { echo "::error::Automatically resolved tag ${RELEASE_TAG} already exists."; exit 1; }
            if [[ "${release_exists}" == true && "${REPLACE_EXISTING_ASSETS}" != true ]]; then
              echo "::error::Tag and release ${RELEASE_TAG} exist. Enable replace_existing_assets only for this exact tag."
              exit 1
            fi
            echo "tagged_source=true" >>"${GITHUB_OUTPUT}"
            echo "existing_release=${release_exists}" >>"${GITHUB_OUTPUT}"
            echo "new_release=false" >>"${GITHUB_OUTPUT}"
          else
            [[ "${release_exists}" != true ]] || { echo '::error::Release collision without tag.'; exit 1; }
            echo 'tagged_source=false' >>"${GITHUB_OUTPUT}"
            echo 'existing_release=false' >>"${GITHUB_OUTPUT}"
            echo 'new_release=true' >>"${GITHUB_OUTPUT}"
          fi

      - name: Prepare exact release source
        id: source
        shell: bash
        env:
          TAGGED_SOURCE: ${{ steps.collision.outputs.tagged_source }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.release_version_code }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [[ "${TAGGED_SOURCE}" == true ]]; then
            git checkout --detach "${RELEASE_TAG}"
            source_version="$(sed -n 's/^version=//p' module/module.prop | head -n1 | tr -d '[:space:]')"
            source_code="$(sed -n 's/^versionCode=//p' module/module.prop | head -n1 | tr -d '[:space:]')"
            [[ "${source_version}" == "${RELEASE_TAG}" ]] || { echo "::error::Tagged source reports ${source_version}."; exit 1; }
            [[ -z "$(printf '%s' "${INPUT_VERSION_CODE}" | xargs)" || "${source_code}" == "${INPUT_VERSION_CODE}" ]] || { echo "::error::Tagged versionCode is ${source_code}."; exit 1; }
          else
            python3 scripts/release_version.py \
              --repo-root . \
              --module-prop module/module.prop \
              --version-tag "${RELEASE_TAG}" \
              --version-code "${RELEASE_VERSION_CODE}" \
              --apply
            if ! git diff --quiet -- module/module.prop; then
              git add module/module.prop
              git commit -m "chore(release): prepare ${RELEASE_TAG}"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
            source_version="${RELEASE_TAG}"
            source_code="${RELEASE_VERSION_CODE}"
          fi

          echo "release_version=${source_version#v}" >>"${GITHUB_OUTPUT}"
          echo "release_version_code=${source_code}" >>"${GITHUB_OUTPUT}"
          echo "release_commit=$(git rev-parse HEAD)" >>"${GITHUB_OUTPUT}"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed root provider
        run: python3 scripts/build-root-provider.py --repo-root . --gradle gradle --timeout 900

      - name: Validate source module and provider version
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.source.outputs.release_version }}
          RELEASE_VERSION_CODE: ${{ steps.source.outputs.release_version_code }}
        run: |
          set -euo pipefail
          find module -type f -name '*.sh' -print -exec sh -n {} ';'
          sh -n module/META-INF/com/google/android/update-binary
          python3 scripts/validate-module.py --module-dir module --expected-version "${RELEASE_TAG}" --expected-version-code "${RELEASE_VERSION_CODE}"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          aapt_path="$(find "${sdk_root}/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n1)"
          badging="$(${aapt_path} dump badging module/system/priv-app/TS18RootFileProvider/TS18RootFileProvider.apk | head -n1)"
          provider_code="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<<"${badging}")"
          provider_name="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"${badging}")"
          [[ "${provider_code}" == "${RELEASE_VERSION_CODE}" ]]
          [[ "${provider_name}" == "${RELEASE_VERSION}" ]]

      - name: Build lean final module
        id: final
        run: python3 scripts/build-magisk-zip.py --module-dir module --out-dir dist --variant final --github-output "${GITHUB_OUTPUT}"

      - name: Build debug module
        id: debug
        run: python3 scripts/build-magisk-zip.py --module-dir module --out-dir dist --variant debug --github-output "${GITHUB_OUTPUT}"

      - name: Verify variant checksums and generate update metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          FINAL_NAME: ${{ steps.final.outputs.zip_name }}
          FINAL_SHA_PATH: ${{ steps.final.outputs.sha256_path }}
          DEBUG_SHA_PATH: ${{ steps.debug.outputs.sha256_path }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c "$(basename "${FINAL_SHA_PATH}")")
          (cd dist && sha256sum -c "$(basename "${DEBUG_SHA_PATH}")")
          python3 scripts/make-update-json.py \
            --module-dir module \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${RELEASE_TAG}" \
            --zip-name "${FINAL_NAME}" \
            --out dist/update.json

      - name: Generate release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_VERSION_CODE: ${{ steps.source.outputs.release_version_code }}
          RELEASE_COMMIT: ${{ steps.source.outputs.release_commit }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          FINAL_NAME: ${{ steps.final.outputs.zip_name }}
          FINAL_SHA: ${{ steps.final.outputs.sha256 }}
          DEBUG_NAME: ${{ steps.debug.outputs.zip_name }}
          DEBUG_SHA: ${{ steps.debug.outputs.sha256 }}
        run: |
          set -euo pipefail
          {
            echo "# ts-docsui ${RELEASE_TAG}"
            echo
            echo '- Module ID: `ts-docsui`'
            echo "- Version code: \`${RELEASE_VERSION_CODE}\`"
            echo "- Source commit: \`${RELEASE_COMMIT}\`"
            echo "- Final module: \`${FINAL_NAME}\`"
            echo "- Final SHA-256: \`${FINAL_SHA}\`"
            echo "- Debug module: \`${DEBUG_NAME}\`"
            echo "- Debug SHA-256: \`${DEBUG_SHA}\`"
            echo
            echo 'The final module contains runtime components only. The debug module adds the bounded diagnostics collector and Magisk Action entry point.'
            echo
            echo '## Changes'
            if [[ -n "${PREVIOUS_TAG}" && "${PREVIOUS_TAG}" != "${RELEASE_TAG}" ]]; then
              git log --no-merges --max-count=50 --pretty='- %s' "${PREVIOUS_TAG}..${RELEASE_COMMIT}"
            else
              git log --no-merges --max-count=20 --pretty='- %s' "${RELEASE_COMMIT}"
            fi
          } >dist/release-notes.md

      - name: Create and push annotated tag
        if: ${{ steps.collision.outputs.new_release == 'true' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_COMMIT: ${{ steps.source.outputs.release_commit }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${RELEASE_COMMIT}" ]] || { echo '::error::Release source moved before tagging.'; exit 1; }
          git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null && { echo "::error::Tag ${RELEASE_TAG} appeared during this run."; exit 1; } || true
          git tag -a "${RELEASE_TAG}" "${RELEASE_COMMIT}" -m "ts-docsui ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Upload validated workflow artifacts
        id: artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ts-docsui-${{ steps.version.outputs.release_tag }}-modules
          path: |
            ${{ steps.final.outputs.zip_path }}
            ${{ steps.final.outputs.sha256_path }}
            ${{ steps.debug.outputs.zip_path }}
            ${{ steps.debug.outputs.sha256_path }}
            dist/update.json
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish new release or replace exact-tag assets
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          EXISTING_RELEASE: ${{ steps.collision.outputs.existing_release }}
          FINAL_ZIP: ${{ steps.final.outputs.zip_path }}
          FINAL_SHA: ${{ steps.final.outputs.sha256_path }}
          DEBUG_ZIP: ${{ steps.debug.outputs.zip_path }}
          DEBUG_SHA: ${{ steps.debug.outputs.sha256_path }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          assets=("${FINAL_ZIP}" "${FINAL_SHA}" "${DEBUG_ZIP}" "${DEBUG_SHA}" dist/update.json)
          if [[ "${EXISTING_RELEASE}" == true ]]; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
            exit 0
          fi
          args=(release create "${RELEASE_TAG}" "${assets[@]}" --verify-tag --title "ts-docsui ${RELEASE_TAG}" --notes-file dist/release-notes.md)
          [[ "${DRAFT}" == true ]] && args+=(--draft)
          [[ "${PRERELEASE}" == true ]] && args+=(--prerelease)
          gh "${args[@]}"

      - name: Write release summary
        if: ${{ always() }}
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.artifacts.outputs.artifact-url }}
        run: |
          {
            echo '## ts-docsui release'
            echo
            echo "- Version: \`${{ steps.version.outputs.release_tag }}\`"
            echo "- Version code: \`${{ steps.source.outputs.release_version_code }}\`"
            echo "- Source commit: \`${{ steps.source.outputs.release_commit }}\`"
            echo "- Final: \`${{ steps.final.outputs.zip_name }}\`"
            echo "- Debug: \`${{ steps.debug.outputs.zip_name }}\`"
            [[ -z "${ARTIFACT_URL}" ]] || echo "- Workflow artifacts: [Download both variants](${ARTIFACT_URL})"
          } >>"${GITHUB_STEP_SUMMARY}"
