name: Release ts-docsui modules
run-name: >-
  release • ${{ inputs.version_tag || 'auto patch' }}

'on':
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version, for example v1.2.3. Leave blank to increment or resume an untagged prepared version.'
        required: false
        default: ''
        type: string
      version_code:
        description: 'Magisk version code. Leave blank to increment or resume the prepared version code.'
        required: false
        default: ''
        type: string
      draft:
        description: 'Create the GitHub release as a draft.'
        required: true
        default: false
        type: boolean
      prerelease:
        description: 'Mark the GitHub release as a prerelease.'
        required: true
        default: false
        type: boolean
      replace_existing_assets:
        description: 'Replace assets only when this exact tag and release already exist.'
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: read

concurrency:
  group: ts-docsui-release
  cancel-in-progress: false

jobs:
  release:
    name: Version, build, tag, and publish both variants
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout full default branch history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Validate release context and repository tooling
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_TYPE}" == branch ]] || { echo '::error::Manual releases must be dispatched from a branch.'; exit 1; }
          default_branch='${{ github.event.repository.default_branch }}'
          [[ "${GITHUB_REF_NAME}" == "${default_branch}" ]] || { echo "::error::Dispatch from ${default_branch}, not ${GITHUB_REF_NAME}."; exit 1; }
          git fetch --force --tags origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse "origin/${GITHUB_REF_NAME}")" ]] || { echo '::error::Release checkout is stale.'; exit 1; }
          ruby -e 'require "yaml"; ARGV.each { |f| Psych.safe_load(File.read(f), permitted_classes: [], permitted_symbols: [], aliases: false); puts "OK #{f}" }' .github/workflows/*.yml
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Resolve requested or automatic version
        id: version
        shell: bash
        env:
          INPUT_VERSION_TAG: ${{ inputs.version_tag }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          REPLACE_EXISTING_ASSETS: ${{ inputs.replace_existing_assets }}
        run: |
          set -euo pipefail
          extra_args=()
          if [[ "${REPLACE_EXISTING_ASSETS}" == true ]]; then
            extra_args+=(--allow-lower-version)
          fi
          python3 scripts/release_version.py \
            --repo-root . \
            --module-prop module/module.prop \
            --version-tag "${INPUT_VERSION_TAG}" \
            --version-code "${INPUT_VERSION_CODE}" \
            --github-output "${GITHUB_OUTPUT}" \
            "${extra_args[@]}"

      - name: Check tag and release collisions
        id: collision
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          INPUT_VERSION_TAG: ${{ inputs.version_tag }}
          REPLACE_EXISTING_ASSETS: ${{ inputs.replace_existing_assets }}
        run: |
          set -euo pipefail
          tag_exists=false
          release_exists=false

          set +e
          git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1
          tag_status=$?
          set -e
          case "${tag_status}" in
            0) tag_exists=true ;;
            2) ;;
            *)
              echo "::error::Unable to query remote tag state for ${RELEASE_TAG}; git ls-remote exited ${tag_status}."
              exit 1
              ;;
          esac

          set +e
          release_query="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>&1)"
          release_status=$?
          set -e
          if (( release_status == 0 )); then
            release_exists=true
          elif [[ "${release_query}" == *'(HTTP 404)'* ]]; then
            release_exists=false
          else
            echo "::error::Unable to query GitHub release state for ${RELEASE_TAG}."
            printf '%s\n' "${release_query}"
            exit 1
          fi

          [[ "${release_exists}" != true || "${tag_exists}" == true ]] || { echo '::error::Release exists without its immutable tag.'; exit 1; }
          if [[ "${REPLACE_EXISTING_ASSETS}" == true && ( "${tag_exists}" != true || "${release_exists}" != true ) ]]; then
            echo '::error::replace_existing_assets requires an existing exact tag and release.'
            exit 1
          fi

          if [[ "${tag_exists}" == true ]]; then
            [[ -n "$(printf '%s' "${INPUT_VERSION_TAG}" | xargs)" ]] || { echo "::error::Automatically resolved tag ${RELEASE_TAG} already exists."; exit 1; }
            if [[ "${release_exists}" == true && "${REPLACE_EXISTING_ASSETS}" != true ]]; then
              echo "::error::Tag and release ${RELEASE_TAG} exist. Enable replace_existing_assets only for this exact tag."
              exit 1
            fi
            echo 'tagged_source=true' >>"${GITHUB_OUTPUT}"
            echo "existing_release=${release_exists}" >>"${GITHUB_OUTPUT}"
            echo 'new_release=false' >>"${GITHUB_OUTPUT}"
          else
            [[ "${release_exists}" != true ]] || { echo '::error::Release collision without tag.'; exit 1; }
            echo 'tagged_source=false' >>"${GITHUB_OUTPUT}"
            echo 'existing_release=false' >>"${GITHUB_OUTPUT}"
            echo 'new_release=true' >>"${GITHUB_OUTPUT}"
          fi

      - name: Prepare exact release metadata
        id: metadata
        shell: bash
        env:
          TAGGED_SOURCE: ${{ steps.collision.outputs.tagged_source }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.release_version_code }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          if [[ "${TAGGED_SOURCE}" == true ]]; then
            git checkout --detach "${RELEASE_TAG}"
            source_version="$(sed -n 's/^version=//p' module/module.prop | head -n1 | tr -d '[:space:]')"
            source_code="$(sed -n 's/^versionCode=//p' module/module.prop | head -n1 | tr -d '[:space:]')"
            [[ "${source_version}" == "${RELEASE_TAG}" ]] || { echo "::error::Tagged source reports ${source_version}."; exit 1; }
            [[ -z "$(printf '%s' "${INPUT_VERSION_CODE}" | xargs)" || "${source_code}" == "${INPUT_VERSION_CODE}" ]] || { echo "::error::Tagged versionCode is ${source_code}."; exit 1; }
          else
            python3 scripts/release_version.py \
              --repo-root . \
              --module-prop module/module.prop \
              --version-tag "${RELEASE_TAG}" \
              --version-code "${RELEASE_VERSION_CODE}" \
              --apply
            source_version="${RELEASE_TAG}"
            source_code="${RELEASE_VERSION_CODE}"
          fi
          echo "release_version=${source_version#v}" >>"${GITHUB_OUTPUT}"
          echo "release_version_code=${source_code}" >>"${GITHUB_OUTPUT}"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed root provider
        id: provider
        shell: bash
        env:
          TAGGED_SOURCE: ${{ steps.collision.outputs.tagged_source }}
        run: |
          set -euo pipefail
          mkdir -p .build
          python3 scripts/build-root-provider.py --repo-root . --gradle gradle --timeout 900
          module_apk='module/system/priv-app/TS18RootFileProvider/TS18RootFileProvider.apk'
          if [[ "${TAGGED_SOURCE}" == true ]]; then
            cp -f -- "${module_apk}" .build/rebuilt-TS18RootFileProvider.apk
            git checkout -- "${module_apk}"
            echo 'built_apk=.build/rebuilt-TS18RootFileProvider.apk' >>"${GITHUB_OUTPUT}"
          else
            echo "built_apk=${module_apk}" >>"${GITHUB_OUTPUT}"
          fi

      - name: Validate source module and provider versions
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.release_version }}
          RELEASE_VERSION_CODE: ${{ steps.metadata.outputs.release_version_code }}
          BUILT_APK: ${{ steps.provider.outputs.built_apk }}
        run: |
          set -euo pipefail
          find module -type f -name '*.sh' -print -exec sh -n {} ';'
          sh -n module/META-INF/com/google/android/update-binary
          python3 scripts/validate-module.py --module-dir module --expected-version "${RELEASE_TAG}" --expected-version-code "${RELEASE_VERSION_CODE}"

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          aapt_path="$(find "${sdk_root}/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n1)"
          apksigner_path="$(find "${sdk_root}/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n1)"
          [[ -x "${aapt_path}" && -x "${apksigner_path}" ]] || { echo '::error::Android build tools are incomplete.'; exit 1; }

          source_apk='module/system/priv-app/TS18RootFileProvider/TS18RootFileProvider.apk'
          for apk in "${source_apk}" "${BUILT_APK}"; do
            badging="$(${aapt_path} dump badging "${apk}" | head -n1)"
            provider_code="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<<"${badging}")"
            provider_name="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"${badging}")"
            [[ "${provider_code}" == "${RELEASE_VERSION_CODE}" ]] || { echo "::error::${apk} versionCode ${provider_code} != ${RELEASE_VERSION_CODE}"; exit 1; }
            [[ "${provider_name}" == "${RELEASE_VERSION}" ]] || { echo "::error::${apk} versionName ${provider_name} != ${RELEASE_VERSION}"; exit 1; }
            "${apksigner_path}" verify --verbose "${apk}"
          done
          echo 'Provider signer identity matched the tracked baseline during build-root-provider.py.'

      - name: Build lean final module
        id: final
        run: python3 scripts/build-magisk-zip.py --module-dir module --out-dir dist --variant final --github-output "${GITHUB_OUTPUT}"

      - name: Build debug module
        id: debug
        run: python3 scripts/build-magisk-zip.py --module-dir module --out-dir dist --variant debug --github-output "${GITHUB_OUTPUT}"

      - name: Verify checksums and generate both update manifests
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          FINAL_NAME: ${{ steps.final.outputs.zip_name }}
          FINAL_SHA_PATH: ${{ steps.final.outputs.sha256_path }}
          DEBUG_NAME: ${{ steps.debug.outputs.zip_name }}
          DEBUG_SHA_PATH: ${{ steps.debug.outputs.sha256_path }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c "$(basename "${FINAL_SHA_PATH}")")
          (cd dist && sha256sum -c "$(basename "${DEBUG_SHA_PATH}")")
          python3 scripts/make-update-json.py \
            --module-dir module \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${RELEASE_TAG}" \
            --zip-name "${FINAL_NAME}" \
            --variant final \
            --out dist/update.json
          python3 scripts/make-update-json.py \
            --module-dir module \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${RELEASE_TAG}" \
            --zip-name "${DEBUG_NAME}" \
            --variant debug \
            --out dist/update-debug.json

      - name: Commit exact new release source
        id: source
        shell: bash
        env:
          TAGGED_SOURCE: ${{ steps.collision.outputs.tagged_source }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          module_prop='module/module.prop'
          provider_apk='module/system/priv-app/TS18RootFileProvider/TS18RootFileProvider.apk'
          if [[ "${TAGGED_SOURCE}" == true ]]; then
            git diff --quiet || { echo '::error::Exact tagged source was modified during rebuild validation.'; git status --short; exit 1; }
          else
            unexpected="$(git diff --name-only | awk -v module_prop="${module_prop}" -v provider_apk="${provider_apk}" '$0 != module_prop && $0 != provider_apk')"
            [[ -z "${unexpected}" ]] || { echo '::error::Unexpected tracked release changes:'; printf '%s\n' "${unexpected}"; exit 1; }
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f -- "${module_prop}" "${provider_apk}"
            if ! git diff --cached --quiet; then
              git commit -m "chore(release): prepare ${RELEASE_TAG}"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
            git diff --quiet || { echo '::error::Release source remains dirty after commit.'; git status --short; exit 1; }
          fi
          echo "release_commit=$(git rev-parse HEAD)" >>"${GITHUB_OUTPUT}"

      - name: Verify artifacts match committed release source
        shell: bash
        env:
          RELEASE_COMMIT: ${{ steps.source.outputs.release_commit }}
          FINAL_ZIP: ${{ steps.final.outputs.zip_path }}
          DEBUG_ZIP: ${{ steps.debug.outputs.zip_path }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${RELEASE_COMMIT}" ]] || { echo '::error::Release source moved after packaging.'; exit 1; }
          python3 - "${FINAL_ZIP}" "${DEBUG_ZIP}" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          final_zip, debug_zip = map(Path, sys.argv[1:])
          source_prop = Path('module/module.prop').read_text(encoding='utf-8')
          source_apk = Path('module/system/priv-app/TS18RootFileProvider/TS18RootFileProvider.apk').read_bytes()
          debug_prop = source_prop.replace(
              'updateJson=https://github.com/cbkii/ts-docsui/releases/latest/download/update.json',
              'updateJson=https://github.com/cbkii/ts-docsui/releases/latest/download/update-debug.json',
          )
          for path, expected_prop in ((final_zip, source_prop), (debug_zip, debug_prop)):
              with zipfile.ZipFile(path, allowZip64=False) as archive:
                  if archive.read('module.prop').decode('utf-8') != expected_prop:
                      raise SystemExit(f'{path.name}: module.prop differs from committed source/channel contract')
                  if archive.read('system/priv-app/TS18RootFileProvider/TS18RootFileProvider.apk') != source_apk:
                      raise SystemExit(f'{path.name}: provider APK differs from committed source')
          print('OK release ZIPs match committed source')
          PY

      - name: Generate release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_VERSION_CODE: ${{ steps.metadata.outputs.release_version_code }}
          RELEASE_COMMIT: ${{ steps.source.outputs.release_commit }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          FINAL_NAME: ${{ steps.final.outputs.zip_name }}
          FINAL_SHA: ${{ steps.final.outputs.sha256 }}
          DEBUG_NAME: ${{ steps.debug.outputs.zip_name }}
          DEBUG_SHA: ${{ steps.debug.outputs.sha256 }}
        run: |
          set -euo pipefail
          {
            echo "# ts-docsui ${RELEASE_TAG}"
            echo
            echo '- Module ID: `ts-docsui`'
            echo "- Version code: \`${RELEASE_VERSION_CODE}\`"
            echo "- Source commit: \`${RELEASE_COMMIT}\`"
            echo "- Final module: \`${FINAL_NAME}\`"
            echo "- Final SHA-256: \`${FINAL_SHA}\`"
            echo "- Debug module: \`${DEBUG_NAME}\`"
            echo "- Debug SHA-256: \`${DEBUG_SHA}\`"
            echo
            echo 'The final module contains runtime components only. The debug module adds the bounded diagnostics collector and Magisk Action entry point.'
            echo 'Both variants expose their own Magisk in-app update channel.'
            echo
            echo '## Changes'
            if [[ -n "${PREVIOUS_TAG}" && "${PREVIOUS_TAG}" != "${RELEASE_TAG}" ]]; then
              git log --no-merges --max-count=50 --pretty='- %s' "${PREVIOUS_TAG}..${RELEASE_COMMIT}"
            else
              git log --no-merges --max-count=20 --pretty='- %s' "${RELEASE_COMMIT}"
            fi
          } >dist/release-notes.md

      - name: Create and push annotated tag
        if: ${{ steps.collision.outputs.new_release == 'true' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_COMMIT: ${{ steps.source.outputs.release_commit }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${RELEASE_COMMIT}" ]] || { echo '::error::Release source moved before tagging.'; exit 1; }
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1
          tag_status=$?
          set -e
          case "${tag_status}" in
            0)
              echo "::error::Tag ${RELEASE_TAG} appeared during this run."
              exit 1
              ;;
            2) ;;
            *)
              echo "::error::Unable to recheck remote tag state for ${RELEASE_TAG}; git ls-remote exited ${tag_status}."
              exit 1
              ;;
          esac
          git tag -a "${RELEASE_TAG}" "${RELEASE_COMMIT}" -m "ts-docsui ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Upload validated workflow artifacts
        id: artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ts-docsui-${{ steps.version.outputs.release_tag }}-modules
          path: |
            ${{ steps.final.outputs.zip_path }}
            ${{ steps.final.outputs.sha256_path }}
            ${{ steps.debug.outputs.zip_path }}
            ${{ steps.debug.outputs.sha256_path }}
            dist/update.json
            dist/update-debug.json
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish new release or replace exact-tag assets
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          EXISTING_RELEASE: ${{ steps.collision.outputs.existing_release }}
          FINAL_ZIP: ${{ steps.final.outputs.zip_path }}
          FINAL_SHA: ${{ steps.final.outputs.sha256_path }}
          DEBUG_ZIP: ${{ steps.debug.outputs.zip_path }}
          DEBUG_SHA: ${{ steps.debug.outputs.sha256_path }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          assets=("${FINAL_ZIP}" "${FINAL_SHA}" "${DEBUG_ZIP}" "${DEBUG_SHA}" dist/update.json dist/update-debug.json)
          if [[ "${EXISTING_RELEASE}" == true ]]; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
            exit 0
          fi
          args=(release create "${RELEASE_TAG}" "${assets[@]}" --verify-tag --title "ts-docsui ${RELEASE_TAG}" --notes-file dist/release-notes.md)
          [[ "${DRAFT}" == true ]] && args+=(--draft)
          [[ "${PRERELEASE}" == true ]] && args+=(--prerelease)
          gh "${args[@]}"

      - name: Write release summary
        if: ${{ always() }}
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.artifacts.outputs.artifact-url }}
        run: |
          {
            echo '## ts-docsui release'
            echo
            echo "- Version: \`${{ steps.version.outputs.release_tag }}\`"
            echo "- Version code: \`${{ steps.metadata.outputs.release_version_code }}\`"
            echo "- Source commit: \`${{ steps.source.outputs.release_commit }}\`"
            echo "- Final: \`${{ steps.final.outputs.zip_name }}\`"
            echo "- Debug: \`${{ steps.debug.outputs.zip_name }}\`"
            echo '- Update manifests: `update.json`, `update-debug.json`'
            [[ -z "${ARTIFACT_URL}" ]] || echo "- Workflow artifacts: [Download both variants](${ARTIFACT_URL})"
          } >>"${GITHUB_STEP_SUMMARY}"
