name: Release Magisk module
run-name: >-
  release • ${{ inputs.version_tag || 'auto patch' }}

'on':
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version, for example v1.2.3. Leave blank to increment the latest patch version.'
        required: false
        default: ''
        type: string
      version_code:
        description: 'Magisk version code. Leave blank to increment the current code by one.'
        required: false
        default: ''
        type: string
      draft:
        description: 'Create the GitHub release as a draft.'
        required: true
        default: false
        type: boolean
      prerelease:
        description: 'Mark the GitHub release as a prerelease.'
        required: true
        default: false
        type: boolean
      replace_existing_assets:
        description: 'Replace module assets only when this exact tag and release already exist.'
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: read

concurrency:
  group: ts-docsui-release
  cancel-in-progress: false

jobs:
  release:
    name: Version, build, tag, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout full default branch history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Validate release context and repository tooling
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "branch" ]]; then
            echo "::error::Manual releases must be dispatched from a branch."
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "${{ github.event.repository.default_branch }}" ]]; then
            echo "::error::Run this workflow from the default branch '${{ github.event.repository.default_branch }}', not '${GITHUB_REF_NAME}'."
            exit 1
          fi
          git fetch --force --tags origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          local_head="$(git rev-parse HEAD)"
          remote_head="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          if [[ "${local_head}" != "${remote_head}" ]]; then
            echo "::error::Release checkout is stale. Re-run from the latest ${GITHUB_REF_NAME}."
            echo "::error::Local HEAD:  ${local_head}"
            echo "::error::Remote HEAD: ${remote_head}"
            exit 1
          fi
          ruby -e 'require "yaml"; ARGV.each { |f| Psych.safe_load(File.read(f), permitted_classes: [], permitted_symbols: [], aliases: false); puts "OK #{f}" }' .github/workflows/*.yml
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Resolve requested or automatic version
        id: version
        shell: bash
        env:
          INPUT_VERSION_TAG: ${{ inputs.version_tag }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          extra_args=()
          if [[ "${{ inputs.replace_existing_assets }}" == true ]]; then
            extra_args+=(--allow-lower-version)
          fi
          python3 scripts/release_version.py \
            --repo-root . \
            --module-prop module/module.prop \
            --version-tag "${INPUT_VERSION_TAG}" \
            --version-code "${INPUT_VERSION_CODE}" \
            --github-output "${GITHUB_OUTPUT}" \
            "${extra_args[@]}"

      - name: Check tag and release collisions
        id: collision
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          INPUT_VERSION_TAG: ${{ inputs.version_tag }}
          REPLACE_EXISTING_ASSETS: ${{ inputs.replace_existing_assets }}
        run: |
          set -euo pipefail
          local_tag=false
          remote_tag=false
          release_exists=false
          git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null && local_tag=true || true
          git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1 && remote_tag=true || true
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 && release_exists=true || true

          if [[ "${local_tag}" != "${remote_tag}" ]]; then
            echo "::error::Local and remote tag state disagree for ${RELEASE_TAG}."
            exit 1
          fi
          if [[ "${remote_tag}" == true && "${release_exists}" != true ]]; then
            echo "::error::Tag ${RELEASE_TAG} exists without a matching GitHub release."
            exit 1
          fi
          if [[ "${release_exists}" == true && "${remote_tag}" != true ]]; then
            echo "::error::Release ${RELEASE_TAG} exists without a matching Git tag."
            exit 1
          fi

          if [[ "${remote_tag}" == true ]]; then
            if [[ -z "$(printf '%s' "${INPUT_VERSION_TAG}" | xargs)" ]]; then
              echo "::error::The automatically resolved tag ${RELEASE_TAG} already exists. Re-run after checking tag history."
              exit 1
            fi
            if [[ "${REPLACE_EXISTING_ASSETS}" != true ]]; then
              echo "::error::Tag and release ${RELEASE_TAG} already exist. Enable replace_existing_assets only to rebuild that exact tagged source."
              exit 1
            fi
            echo "existing_release=true" >> "${GITHUB_OUTPUT}"
            echo "new_release=false" >> "${GITHUB_OUTPUT}"
            echo "tag_commit=$(git rev-list -n 1 "${RELEASE_TAG}")" >> "${GITHUB_OUTPUT}"
          else
            echo "existing_release=false" >> "${GITHUB_OUTPUT}"
            echo "new_release=true" >> "${GITHUB_OUTPUT}"
            echo "tag_commit=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Prepare exact release source and metadata
        id: source
        shell: bash
        env:
          EXISTING_RELEASE: ${{ steps.collision.outputs.existing_release }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.release_version_code }}
          CURRENT_VERSION: ${{ steps.version.outputs.current_version }}
          CURRENT_VERSION_CODE: ${{ steps.version.outputs.current_version_code }}
          VERSION_INCREASES: ${{ steps.version.outputs.version_increases }}
          INPUT_VERSION_TAG: ${{ inputs.version_tag }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [[ "${EXISTING_RELEASE}" == true ]]; then
            git checkout --detach "${RELEASE_TAG}"
            source_version="$(sed -n 's/^version=//p' module/module.prop | head -n1 | tr -d '[:space:]')"
            source_code="$(sed -n 's/^versionCode=//p' module/module.prop | head -n1 | tr -d '[:space:]')"
            if [[ "${source_version}" != "${RELEASE_TAG}" ]]; then
              echo "::error::Tagged source reports ${source_version}, not ${RELEASE_TAG}."
              exit 1
            fi
            if [[ -n "$(printf '%s' "${INPUT_VERSION_CODE}" | xargs)" && "${source_code}" != "${INPUT_VERSION_CODE}" ]]; then
              echo "::error::Existing tag versionCode is ${source_code}, not requested ${INPUT_VERSION_CODE}."
              exit 1
            fi
            echo "release_version=${source_version#v}" >> "${GITHUB_OUTPUT}"
            echo "release_version_code=${source_code}" >> "${GITHUB_OUTPUT}"
            echo "release_commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
            echo "metadata_commit_created=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${RELEASE_TAG}" != "${CURRENT_VERSION}" && "${VERSION_INCREASES}" != true ]]; then
            echo "::error::New release version ${RELEASE_TAG} is lower than current ${CURRENT_VERSION}."
            exit 1
          fi
          if (( RELEASE_VERSION_CODE <= CURRENT_VERSION_CODE )); then
            echo "::error::New releases require a versionCode greater than ${CURRENT_VERSION_CODE}; resolved ${RELEASE_VERSION_CODE}."
            exit 1
          fi

          python3 scripts/release_version.py \
            --repo-root . \
            --module-prop module/module.prop \
            --version-tag "${RELEASE_TAG}" \
            --version-code "${RELEASE_VERSION_CODE}" \
            --apply
          python3 scripts/sync_runtime_version.py --repo-root . --apply

          if git diff --quiet -- module/module.prop module/service.sh module/tools/ts18-saf-deepdiag.sh; then
            echo 'Version metadata already matches the requested new release.'
            metadata_commit_created=false
          else
            git add module/module.prop module/service.sh module/tools/ts18-saf-deepdiag.sh
            git commit -m "chore(release): prepare ${RELEASE_TAG}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            metadata_commit_created=true
          fi

          echo "release_version=${RELEASE_TAG#v}" >> "${GITHUB_OUTPUT}"
          echo "release_version_code=${RELEASE_VERSION_CODE}" >> "${GITHUB_OUTPUT}"
          echo "release_commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "metadata_commit_created=${metadata_commit_created}" >> "${GITHUB_OUTPUT}"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed root provider
        shell: bash
        run: python3 scripts/build-root-provider.py --repo-root . --gradle gradle --timeout 900

      - name: Validate scripts, module, and provider version
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.source.outputs.release_version }}
          RELEASE_VERSION_CODE: ${{ steps.source.outputs.release_version_code }}
        run: |
          set -euo pipefail
          find module -type f -name '*.sh' -print -exec sh -n {} ';'
          sh -n module/META-INF/com/google/android/update-binary
          python3 scripts/validate-module.py \
            --module-dir module \
            --expected-version "${RELEASE_TAG}" \
            --expected-version-code "${RELEASE_VERSION_CODE}"
          python3 scripts/sync_runtime_version.py --repo-root . --check

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          aapt_path="$(find "${sdk_root}/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n1)"
          [[ -x "${aapt_path}" ]] || { echo '::error::aapt was not found.'; exit 1; }
          badging="$(${aapt_path} dump badging module/system/priv-app/TS18RootFileProvider/TS18RootFileProvider.apk | head -n1)"
          provider_code="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "${badging}")"
          provider_name="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "${badging}")"
          [[ "${provider_code}" == "${RELEASE_VERSION_CODE}" ]] || { echo "::error::Provider versionCode ${provider_code} != ${RELEASE_VERSION_CODE}"; exit 1; }
          [[ "${provider_name}" == "${RELEASE_VERSION}" ]] || { echo "::error::Provider versionName ${provider_name} != ${RELEASE_VERSION}"; exit 1; }

      - name: Build deterministic installable ZIP
        id: build
        shell: bash
        run: python3 scripts/build-magisk-zip.py --module-dir module --out-dir dist --github-output "${GITHUB_OUTPUT}"

      - name: Verify ZIP structure and checksum
        shell: bash
        env:
          ZIP_PATH: ${{ steps.build.outputs.zip_path }}
          SHA_PATH: ${{ steps.build.outputs.sha256_path }}
        run: |
          set -euo pipefail
          python3 - "${ZIP_PATH}" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          path = Path(sys.argv[1])
          with zipfile.ZipFile(path) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f'corrupt ZIP member: {bad}')
              required = {
                  'module.prop',
                  'customize.sh',
                  'system/priv-app/DocumentsUI/DocumentsUI.apk',
                  'system/priv-app/TS18RootFileProvider/TS18RootFileProvider.apk',
                  'tools/rootfs-helper.sh',
              }
              names = set(archive.namelist())
              missing = required - names
              if missing:
                  raise SystemExit(f'missing ZIP entries: {sorted(missing)}')
              compressed = [item.filename for item in archive.infolist() if item.compress_type != zipfile.ZIP_STORED]
              if compressed:
                  raise SystemExit(f'non-STORE entries: {compressed[:10]}')
          print(f'OK {path}')
          PY
          (cd "$(dirname "${SHA_PATH}")" && sha256sum -c "$(basename "${SHA_PATH}")")

      - name: Generate update metadata and release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_VERSION_CODE: ${{ steps.source.outputs.release_version_code }}
          RELEASE_COMMIT: ${{ steps.source.outputs.release_commit }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          ZIP_NAME: ${{ steps.build.outputs.zip_name }}
          ZIP_SHA256: ${{ steps.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/make-update-json.py \
            --module-dir module \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${RELEASE_TAG}" \
            --zip-name "${ZIP_NAME}" \
            --out dist/update.json

          {
            echo "# TS18 Full File Picker ${RELEASE_TAG}"
            echo
            echo "- Module ID: \`ts18_documentsui_saf_full\`"
            echo "- Version code: \`${RELEASE_VERSION_CODE}\`"
            echo "- Source commit: \`${RELEASE_COMMIT}\`"
            echo "- ZIP SHA-256: \`${ZIP_SHA256}\`"
            echo
            echo 'Restores the Android system file picker, exposes full internal storage, and provides a separate Magisk-root file source for root-only paths.'
            echo
            echo '## Changes'
            if [[ -n "${PREVIOUS_TAG}" && "${PREVIOUS_TAG}" != "${RELEASE_TAG}" ]]; then
              git log --no-merges --pretty='- %s' "${PREVIOUS_TAG}..${RELEASE_COMMIT}" | head -n 50
            else
              git log --no-merges --pretty='- %s' -n 20 "${RELEASE_COMMIT}"
            fi
          } > dist/release-notes.md

      - name: Create and push annotated tag
        if: ${{ steps.collision.outputs.new_release == 'true' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_COMMIT: ${{ steps.source.outputs.release_commit }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${RELEASE_COMMIT}" ]] || { echo '::error::Release source moved before tagging.'; exit 1; }
          git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null && { echo "::error::Tag ${RELEASE_TAG} appeared during this run."; exit 1; } || true
          git tag -a "${RELEASE_TAG}" "${RELEASE_COMMIT}" -m "TS18 Full File Picker ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Upload validated workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.zip_name }}
          path: |
            ${{ steps.build.outputs.zip_path }}
            ${{ steps.build.outputs.sha256_path }}
            dist/update.json
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish new release or replace exact-tag assets
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_NAME: TS18 Full File Picker ${{ steps.version.outputs.release_tag }}
          EXISTING_RELEASE: ${{ steps.collision.outputs.existing_release }}
          ZIP_PATH: ${{ steps.build.outputs.zip_path }}
          SHA_PATH: ${{ steps.build.outputs.sha256_path }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ "${EXISTING_RELEASE}" == true ]]; then
            gh release upload "${RELEASE_TAG}" "${ZIP_PATH}" "${SHA_PATH}" dist/update.json --clobber
            exit 0
          fi

          args=(release create "${RELEASE_TAG}" "${ZIP_PATH}" "${SHA_PATH}" dist/update.json --verify-tag --title "${RELEASE_NAME}" --notes-file dist/release-notes.md)
          [[ "${DRAFT}" == true ]] && args+=(--draft)
          [[ "${PRERELEASE}" == true ]] && args+=(--prerelease)
          gh "${args[@]}"

      - name: Write release summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo '## TS18 Magisk release'
            echo
            echo "- Version: \`${{ steps.version.outputs.release_tag }}\`"
            echo "- Version code: \`${{ steps.source.outputs.release_version_code }}\`"
            echo "- Existing release rebuild: \`${{ steps.collision.outputs.existing_release }}\`"
            echo "- Source commit: \`${{ steps.source.outputs.release_commit }}\`"
            echo "- ZIP: \`${{ steps.build.outputs.zip_name }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
