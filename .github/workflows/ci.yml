name: Validate TS18 file picker module

'on':
  push:
    branches:
      - main
      - 'fix/**'
      - 'feature/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ts-docsui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build provider and Magisk ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate Python and release versioning
        run: |
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/release_version.py --repo-root . --module-prop module/module.prop
          python3 scripts/sync_runtime_version.py --repo-root . --check

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed root provider
        id: provider
        continue-on-error: true
        run: |
          mkdir -p .build
          set -o pipefail
          python3 scripts/build-root-provider.py --repo-root . --gradle gradle --timeout 900 2>&1 | tee .build/root-provider-build.log

      - name: Upload provider build evidence
        id: provider_evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: root-provider-build-evidence
          path: |
            .build/root-provider-build.log
            rootprovider/build/reports/lint-results-release.txt
            rootprovider/build/reports/lint-results-release.html
            rootprovider/build/reports/problems/problems-report.html
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce provider build success
        if: ${{ steps.provider.outcome != 'success' }}
        run: |
          echo 'The signed root-provider build failed. See root-provider-build-evidence.' >&2
          exit 1

      - name: Validate shell syntax
        run: |
          find module -type f -name '*.sh' -print -exec sh -n {} ';'
          sh -n module/META-INF/com/google/android/update-binary

      - name: Validate module and provider metadata
        run: |
          set -euo pipefail
          module_version="$(sed -n 's/^version=//p' module/module.prop | head -n1 | tr -d '[:space:]')"
          module_code="$(sed -n 's/^versionCode=//p' module/module.prop | head -n1 | tr -d '[:space:]')"
          python3 scripts/validate-module.py \
            --module-dir module \
            --expected-version "${module_version}" \
            --expected-version-code "${module_code}"

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          aapt_path="$(find "${sdk_root}/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n1)"
          badging="$(${aapt_path} dump badging module/system/priv-app/TS18RootFileProvider/TS18RootFileProvider.apk | head -n1)"
          provider_code="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "${badging}")"
          provider_name="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "${badging}")"
          [[ "${provider_code}" == "${module_code}" ]]
          [[ "${provider_name}" == "${module_version#v}" ]]

      - name: Build installable ZIP
        id: module
        run: python3 scripts/build-magisk-zip.py --module-dir module --out-dir dist --github-output "$GITHUB_OUTPUT"

      - name: Verify installable ZIP
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          zips = list(Path('dist').glob('*.zip'))
          if len(zips) != 1:
              raise SystemExit(f'expected one ZIP, found {zips}')
          with zipfile.ZipFile(zips[0]) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f'corrupt ZIP member: {bad}')
              names = set(archive.namelist())
              required = {
                  'module.prop',
                  'customize.sh',
                  'system/priv-app/DocumentsUI/DocumentsUI.apk',
                  'system/priv-app/TS18RootFileProvider/TS18RootFileProvider.apk',
                  'tools/rootfs-helper.sh',
              }
              missing = required - names
              if missing:
                  raise SystemExit(f'missing ZIP entries: {sorted(missing)}')
              compressed = [info.filename for info in archive.infolist() if info.compress_type != zipfile.ZIP_STORED]
              if compressed:
                  raise SystemExit(f'non-STORE entries: {compressed[:10]}')
          print(f'OK {zips[0]}')
          PY
          (cd dist && sha256sum -c "$(basename '${{ steps.module.outputs.sha256_path }}')")

      - name: Upload installable module
        id: installable_module
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.module.outputs.zip_name }}
          path: |
            ${{ steps.module.outputs.zip_path }}
            ${{ steps.module.outputs.sha256_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Write artifact summary
        if: ${{ always() }}
        env:
          PROVIDER_EVIDENCE_URL: ${{ steps.provider_evidence.outputs.artifact-url }}
          MODULE_URL: ${{ steps.installable_module.outputs.artifact-url }}
          MODULE_NAME: ${{ steps.module.outputs.zip_name }}
        run: |
          {
            echo '## TS18 Full File Picker artifacts'
            echo
            echo '| Artifact | Download | Contents |'
            echo '|---|---|---|'
            if [[ -n "${MODULE_URL}" ]]; then
              echo "| Installable module (${MODULE_NAME}) | [Download](${MODULE_URL}) | Magisk ZIP and SHA-256 |"
            fi
            if [[ -n "${PROVIDER_EVIDENCE_URL}" ]]; then
              echo "| Root-provider build evidence | [Download](${PROVIDER_EVIDENCE_URL}) | Complete build log and lint reports |"
            fi
            if [[ -z "${MODULE_URL}${PROVIDER_EVIDENCE_URL}" ]]; then
              echo '| None | No artifact was generated | Inspect the failed step above |'
            fi
          } >>"${GITHUB_STEP_SUMMARY}"
