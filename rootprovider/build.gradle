import java.util.Properties

plugins {
    id 'com.android.application'
}

final Properties moduleProperties = new Properties()
final File modulePropFile = rootProject.file('module/module.prop')
if (!modulePropFile.isFile()) {
    throw new GradleException("Missing module metadata: ${modulePropFile}")
}
modulePropFile.withInputStream { moduleProperties.load(it) }

final String moduleVersion = moduleProperties.getProperty('version', '').trim()
final String moduleVersionCode = moduleProperties.getProperty('versionCode', '').trim()
if (!(moduleVersion ==~ /^v[0-9]+\.[0-9]+\.[0-9]+$/)) {
    throw new GradleException("module.prop version must use vMAJOR.MINOR.PATCH: ${moduleVersion}")
}
if (!(moduleVersionCode ==~ /^[0-9]+$/)) {
    throw new GradleException("module.prop versionCode must be numeric: ${moduleVersionCode}")
}

android {
    namespace 'com.cbkii.tsdocsui.rootprovider'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cbkii.tsdocsui.rootprovider'
        minSdk 26
        // Deliberate: this systemless provider runs only on Android 10/API 29 TS18 units.
        // Targeting 28 retains legacy shared-storage behaviour required by that OEM platform.
        targetSdk 28
        versionCode moduleVersionCode.toInteger()
        versionName moduleVersion.substring(1)
    }

    signingConfigs {
        release {
            storeFile file('keystore/tsdocsui-root-provider.jks')
            storePassword 'tsdocsui'
            keyAlias 'tsdocsui'
            keyPassword 'tsdocsui'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        // This APK is not published to Google Play; API 28 targeting is intentional for TS18.
        disable 'ExpiredTargetSdkVersion'
    }
}
